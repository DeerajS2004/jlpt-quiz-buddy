name: Release (Linux)

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Debug icon file
        run: |
          file src-tauri/icons/icon.png
          ls -la src-tauri/icons/
          head -c 16 src-tauri/icons/icon.png | xxd
          
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "JLPT Practice ${{ github.ref_name }}"
          releaseBody: |
            Automated Linux build.

            Downloads:
            - `.deb` — Pop!_OS / Ubuntu / Debian (22.04+)
            - `.AppImage` — portable, any modern Linux
          releaseDraft: false
          prerelease: false
          args: ""
