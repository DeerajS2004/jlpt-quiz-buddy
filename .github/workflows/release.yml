name: Release (Linux)

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web app (nitro node-server)
        run: bun run build

      - name: Package Electron app (Linux x64)
        run: |
          bunx electron-packager . "JLPT Practice" \
            --platform=linux --arch=x64 \
            --out=electron-release --overwrite --prune=true \
            --ignore="^/src$" \
            --ignore="^/public$" \
            --ignore="^/electron-release$" \
            --ignore="^/\.github$" \
            --ignore="^/jlpt$"

      - name: Archive build
        run: |
          cd electron-release
          tar czf "JLPT-Practice-linux-x64.tar.gz" "JLPT Practice-linux-x64"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: electron-release/JLPT-Practice-linux-x64.tar.gz
          generate_release_notes: true
